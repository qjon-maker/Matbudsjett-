<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Matbudsjett</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="En enkel og fin budsjettapp for matbudsjett." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Matbudsjett" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Your styles here */
    :root {
      --bg: #eef4fc;
      --bg-2: #e7f0fb;
      --card: rgba(255, 255, 255, .84);
      --text: #132033;
      --muted: #69798f;
      --line: #dce7f3;
      --primary: #2563eb;
      --primary-2: #38bdf8;
      --primary-soft: #eef5ff;
      --good: #15803d;
      --warn: #b45309;
      --danger: #b91c1c;
      --shadow: 0 20px 48px rgba(15, 23, 42, .10);
      --shadow-soft: 0 10px 26px rgba(15, 23, 42, .07);
      --shadow-tiny: 0 5px 14px rgba(15, 23, 42, .05);
      --radius: 26px;
      --bottom-nav-h: 86px;
      --maxw: 1120px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: max(14px, env(safe-area-inset-top)) 14px calc(var(--bottom-nav-h) + 24px + env(safe-area-inset-bottom)) 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f3f8ff 0%, var(--bg) 210px, var(--bg-2) 100%);
    }
    .hidden { display: none !important; }
    .app { max-width: var(--maxw); margin: 0 auto; animation: fadeIn .28s ease; }
    /* Other styles ... */
  </style>
</head>

<body>
  <div id="toastWrap" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

  <div id="setupScreen" class="setup-screen hidden">
    <!-- Setup screen content -->
  </div>

  <div class="app hidden" id="mainApp">
    <!-- Main app content -->

    <div id="settingsTab" class="tab-panel">
      <div class="card">
        <h2 class="section-title" data-i18n="settings">Innstillinger</h2>

        <div class="single-action">
          <button id="createSharedBtn" type="button">Opprett delt budsjett</button>
        </div>

        <div class="helper-text">Testknapp for delt budsjett. Selve delingen bygger vi ferdig i neste steg.</div>

        <!-- Other settings inputs -->
        <div class="settings-grid">
          <div><label for="budget" data-i18n="budget_label">Budsjett for denne perioden</label><input id="budget" type="number" inputmode="numeric" placeholder="F.eks. 6000" /></div>
          <div><label for="startDay" data-i18n="start_day_label">Startdag for perioden</label><select id="startDay"></select></div>
        </div>
        <!-- Other settings for period type, language, currency, etc. -->
      </div>
    </div>

    <!-- Your other tabs like overview, history, shops -->

  </div>

  <script>
    const SUPABASE_URL = "...";
    const SUPABASE_ANON_KEY = "...";
    let supabaseClient = null;

    try {
      supabaseClient =
        window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
          : null;
    } catch (e) {
      console.error("Supabase init feilet", e);
      supabaseClient = null;
    }

    // Function to create a shared budget
    const createSharedBudget = async () => {
      const budgetAmount = document.getElementById("budget").value;
      if (!budgetAmount || Number(budgetAmount) <= 0) {
        alert("Vennligst legg inn et gyldig budsjett");
        return;
      }

      if (!supabaseClient) {
        alert("Supabase ikke koblet");
        return;
      }

      // Generating a random share code
      const shareCode = Math.random().toString(36).substring(2, 8).toUpperCase();

      const { data, error } = await supabaseClient
        .from('shared_budgets')
        .insert([
          {
            budget_amount: budgetAmount,
            share_code: shareCode,
            start_day: getStartDay(),
            period_mode: getPeriodMode(),
            period_length: getPeriodLength(),
            currency: getCurrency(),
            language: getLang(),
          }
        ]);

      if (error) {
        console.error('Feil ved oppretting av delt budsjett:', error.message);
        alert('Feil: Kunne ikke opprette delt budsjett.');
      } else {
        alert(`Delt budsjett opprettet. Kode: ${shareCode}`);
      }
    };

    // Function to get a shared budget based on share code
    const getSharedBudget = async () => {
      const shareCode = document.getElementById("shareCodeInput").value;
      if (!shareCode) {
        alert("Vennligst skriv inn en delingskode");
        return;
      }

      if (!supabaseClient) {
        alert("Supabase ikke koblet");
        return;
      }

      // Search for budget by share code
      const { data, error } = await supabaseClient
        .from('shared_budgets')
        .select('*')
        .eq('share_code', shareCode)
        .single(); 

      if (error) {
        console.error('Feil ved henting av delt budsjett:', error.message);
        alert('Feil: Koden er ugyldig eller budsjettet finnes ikke.');
      } else {
        // Display budget data in app
        document.getElementById("shareCodeInfo").innerText = `Budsjett hentet! Beløp: ${data.budget_amount} ${data.currency}. Periode: ${data.start_day} - ${data.period_length} ${data.period_mode}.`;
      }
    };

    // Attach event listeners
    document.getElementById("createSharedBtn").addEventListener("click", createSharedBudget);
    document.getElementById("getSharedBudgetBtn").addEventListener("click", getSharedBudget);
    
    // Initialize the app
    function boot() {
      // Set up everything on page load
    }

    boot();
  </script>
</body>
</html>
