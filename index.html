<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Matbudsjett</title>
<meta name="theme-color" content="#2563eb" />
<meta name="description" content="En enkel og fin budsjettapp for matbudsjett." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Matbudsjett" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root{
    --bg:#eef4fc;
    --bg-2:#e7f0fb;
    --card:rgba(255,255,255,.84);
    --text:#132033;
    --muted:#69798f;
    --line:#dce7f3;
    --primary:#2563eb;
    --primary-2:#38bdf8;
    --primary-soft:#eef5ff;
    --good:#15803d;
    --warn:#b45309;
    --danger:#b91c1c;
    --shadow:0 20px 48px rgba(15,23,42,.10);
    --shadow-soft:0 10px 26px rgba(15,23,42,.07);
    --shadow-tiny:0 5px 14px rgba(15,23,42,.05);
    --radius:26px;
    --bottom-nav-h:86px;
    --maxw:1120px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    padding:max(14px, env(safe-area-inset-top)) 14px calc(var(--bottom-nav-h) + 24px + env(safe-area-inset-bottom)) 14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at top, rgba(56,189,248,.15), transparent 28%),
      radial-gradient(circle at 92% 8%, rgba(37,99,235,.08), transparent 18%),
      linear-gradient(180deg,#f3f8ff 0%, var(--bg) 210px, var(--bg-2) 100%);
  }

  .hidden{display:none !important}
  .app{max-width:var(--maxw);margin:0 auto;animation:fadeIn .28s ease}
  .setup-screen{max-width:760px;margin:18px auto 0;animation:fadeUp .34s ease}

  .setup-card{background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 28px 70px rgba(15,23,42,.14);border:1px solid rgba(255,255,255,.68)}
  .setup-top{
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;padding:28px 24px;display:flex;gap:16px;align-items:flex-start;position:relative;overflow:hidden;
  }
  .setup-top::after,.hero::after{content:"";position:absolute;right:-40px;bottom:-40px;width:190px;height:190px;background:radial-gradient(circle, rgba(255,255,255,.18), transparent 66%);pointer-events:none}
  .setup-badge,.hero-badge{width:70px;height:70px;border-radius:23px;flex:0 0 auto;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 12px 26px rgba(0,0,0,.08);backdrop-filter:blur(8px)}
  .setup-top h1,.hero h1{margin:0 0 6px;font-size:30px;letter-spacing:-.04em;line-height:1.02}
  .setup-top p{margin:0;opacity:.96;line-height:1.45}
  .setup-body{padding:18px}
  .setup-info{display:grid;gap:10px;margin-bottom:16px}
  .setup-info-item{background:#f8fbff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;line-height:1.45}

  .hero{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-radius:32px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden;animation:fadeUp .32s ease}
  .hero-top{display:flex;gap:14px;align-items:center}
  .hero-copy{min-width:0;flex:1}
  .period{margin-top:10px;font-size:13px;opacity:.95;display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px)}

  .pwa-bar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:14px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border:1px solid rgba(220,231,243,.92);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow-soft);animation:fadeUp .28s ease}
  .pwa-info{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pwa-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#f8fbff;border:1px solid var(--line);color:var(--text)}
  .pwa-pill.good{background:#ecfdf3;border-color:#86efac;color:#166534}
  .pwa-pill.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
  .pwa-actions{display:flex;gap:8px;flex-wrap:wrap}

  .tab-panel{display:none;animation:fadeIn .22s ease}
  .tab-panel.active{display:block}
  .grid,.charts{display:grid;grid-template-columns:1fr;gap:14px}
  .settings-grid,.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .card{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(220,231,243,.96);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-soft);animation:fadeUp .26s ease}
  .section-title{margin:0 0 12px;font-size:18px;font-weight:900;letter-spacing:-.02em}
  .section-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .small-title{margin:0 0 8px;font-size:16px;font-weight:900}

  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 6px;font-weight:800;letter-spacing:.01em}
  input,select,button{width:100%;border:none;border-radius:16px;padding:14px;font-size:16px;font-family:inherit}
  input,select{background:#f8fbff;border:1px solid var(--line);color:var(--text);outline:none;min-height:50px;transition:border-color .18s ease, box-shadow .18s ease, background .18s ease}
  input:focus,select:focus{border-color:#9fc5ff;box-shadow:0 0 0 4px rgba(37,99,235,.10);background:#fff}
  input::placeholder{color:#96a5ba}

  button{background:linear-gradient(135deg,var(--primary),#3478f6);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 20px rgba(37,99,235,.18);transition:transform .14s ease, box-shadow .14s ease;min-height:50px}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0) scale(.985);box-shadow:0 6px 14px rgba(37,99,235,.16)}
  button.secondary{background:var(--primary-soft);color:var(--primary);border:1px solid #d7e6ff;box-shadow:none}
  button.ghost{background:rgba(255,255,255,.92);color:var(--text);border:1px solid var(--line);box-shadow:none}
  button.danger{background:#fff1f2;color:var(--danger);border:1px solid #fecdd3;box-shadow:none}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:linear-gradient(180deg,rgba(255,255,255,.84) 0%, rgba(248,251,255,.96) 100%);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow-tiny)}
  .stat .label{font-size:12px;color:var(--muted);margin-bottom:5px}
  .stat .value{font-size:22px;font-weight:900;line-height:1.15;letter-spacing:-.04em}
  .wide{grid-column:1/-1}
  .status{margin-top:10px;font-weight:900;line-height:1.45}
  .status.good{color:var(--good)}
  .status.warn{color:var(--warn)}

  .quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .quick-btn{padding:10px;border-radius:14px;font-size:14px;font-weight:900;min-height:44px}
  .helper-text{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.45}
  .form-stack{display:grid;gap:2px}

  .date-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .date-strip::-webkit-scrollbar{display:none}
  .date-chip{min-width:94px;padding:10px 12px;border-radius:18px;border:1px solid var(--line);background:#f8fbff;color:#18212f !important;flex:0 0 auto;text-align:center;cursor:pointer;scroll-snap-align:start;transition:transform .15s ease, box-shadow .15s ease;border-color .15s ease;box-shadow:var(--shadow-tiny)}
  .date-chip .top,.date-chip .bottom,.date-chip .sub{color:inherit !important}
  .date-chip:hover{transform:translateY(-1px)}
  .date-chip.active{transform:translateY(-1px);box-shadow:0 0 0 2px rgba(37,99,235,.18),0 10px 18px rgba(15,23,42,.06)}
  .date-chip.today{box-shadow:inset 0 0 0 2px rgba(37,99,235,.18)}
  .date-chip.active.today{box-shadow:inset 0 0 0 2px rgba(37,99,235,.18),0 0 0 2px rgba(37,99,235,.18),0 10px 18px rgba(15,23,42,.06)}
  .date-chip .top{display:block;font-size:12px;opacity:.80;margin-bottom:2px}
  .date-chip .bottom{display:block;font-size:17px;font-weight:900;line-height:1.1}
  .date-chip .sub{display:block;font-size:11px;margin-top:3px;opacity:.85}
  .date-chip.zero{background:#ecfdf3;border-color:#86efac;color:#166534}
  .date-chip.ok-1{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
  .date-chip.ok-2{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
  .date-chip.warn-1{background:#fffbeb;border-color:#fde68a;color:#a16207}
  .date-chip.warn-2{background:#fef3c7;border-color:#fcd34d;color:#92400e}
  .date-chip.bad-1{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
  .date-chip.bad-2{background:#fecaca;border-color:#f87171;color:#991b1b}

  .day-summary{margin-top:12px;padding:14px;border-radius:18px;background:#f8fbff;border:1px solid var(--line);line-height:1.65}
  .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .item,.period-row,.shop-row{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow-tiny);animation:fadeUp .18s ease}
  .item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item-amount{font-size:18px;font-weight:900;letter-spacing:-.03em}
  .item-meta,.small{color:var(--muted);font-size:13px;line-height:1.45}
  .item-actions,.footer-actions,.setup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .single-action{margin-top:10px}
  canvas{width:100% !important;max-height:300px}
  .chart-wrap{min-height:260px}
  .empty{color:var(--muted);background:#f8fbff;border:1px dashed var(--line);border-radius:18px;padding:14px;text-align:center}
  .pill{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:var(--primary-soft);color:var(--primary);margin-top:8px}
  .big{font-weight:900}
  .backup-note{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.55}

  .heatmap-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .heatmap-month-title{font-size:16px;font-weight:900}
  .heatmap-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .heatmap-legend-item{display:flex;align-items:center;gap:6px}
  .heatmap-swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
  .heatmap-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .heatmap-weekday{text-align:center;font-size:11px;color:var(--muted);font-weight:800}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .heatmap-day{border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;font-weight:800;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;color:#18212f;background:#f8fbff;min-height:42px;padding:4px}
  .heatmap-day:hover{transform:translateY(-1px);box-shadow:var(--shadow-tiny)}
  .heatmap-day .num{font-size:13px;font-weight:900;line-height:1}
  .heatmap-day .amt{font-size:9px;margin-top:4px;opacity:.8}
  .heatmap-empty{visibility:hidden}
  .heat-zero{ background:#ecfdf3; border-color:#86efac; color:#166534; }
  .heat-ok1{ background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
  .heat-ok2{ background:#dbeafe; border-color:#93c5fd; color:#1e40af; }
  .heat-warn1{ background:#fffbeb; border-color:#fde68a; color:#a16207; }
  .heat-warn2{ background:#fef3c7; border-color:#fcd34d; color:#92400e; }
  .heat-bad1{ background:#fee2e2; border-color:#fca5a5; color:#b91c1c; }
  .heat-bad2{ background:#fecaca; border-color:#f87171; color:#991b1b; }

  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;width:min(720px, calc(100vw - 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(255,255,255,.90);backdrop-filter:blur(18px);border:1px solid rgba(220,231,243,.96);border-radius:24px;padding:10px;box-shadow:0 18px 40px rgba(15,23,42,.13)}
  .tab-btn{width:100%;border:none;border-radius:16px;padding:10px 8px;min-height:56px;background:transparent;color:#5a6d87;font-size:12px;font-weight:800;cursor:pointer;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;line-height:1.1}
  .tab-btn .tab-ico{width:20px;height:20px;display:block;opacity:.9}
  .tab-btn.active{background:linear-gradient(135deg,var(--primary),#3478f6);color:#fff;box-shadow:0 10px 20px rgba(37,99,235,.20)}

  .toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom-nav-h) + 22px + env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw, 420px);pointer-events:none}
  .toast{background:rgba(20,32,51,.94);color:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 16px 30px rgba(0,0,0,.18);font-size:14px;line-height:1.4;animation:toastIn .22s ease;pointer-events:auto}
  .toast.good{background:rgba(21,128,61,.94)}
  .toast.warn{background:rgba(180,83,9,.94)}
  .toast.danger{background:rgba(185,28,28,.94)}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

  @media (max-width:759px){
    .hero{padding:18px 16px;border-radius:28px}
    .hero-top{align-items:flex-start}
    .hero h1,.setup-top h1{font-size:28px}
    .setup-badge,.hero-badge{width:62px;height:62px;border-radius:20px}
    .settings-grid,.row{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .card{padding:14px;border-radius:22px}
    .item-actions,.footer-actions,.setup-actions{grid-template-columns:1fr}
    .quick-actions{grid-template-columns:repeat(4,1fr)}
    .tab-btn{min-height:54px;font-size:11px}
  }

  @media (min-width:760px){
    .grid{grid-template-columns:1.02fr .98fr}
    .charts{grid-template-columns:1fr 1fr}
    .heatmap-grid,.heatmap-weekdays{gap:8px}
    .heatmap-day{min-height:62px}
    .heatmap-day .num{font-size:16px}
    .heatmap-day .amt{font-size:10px}
  }

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>

  <script>
  const SUPABASE_URL = "https://aodzgsmdlxzgidscpxkn.supabase.co";
  const SUPABASE_ANON_KEY = "LIM_INN_ANON_KEY_HER";

  let supabaseClient = null;
  try {
    supabaseClient =
      window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  function generateShareCode() {
    return Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  async function createSharedBudget() {
    if (!supabaseClient) {
      alert("Supabase ikke koblet");
      return;
    }

    const budgetValue = Number(document.getElementById("budget")?.value || 0);
    const startDayValue = Number(document.getElementById("startDay")?.value || 20);
    const periodModeValue = document.getElementById("periodMode")?.value || "months";
    const periodLengthValue = Number(document.getElementById("periodLength")?.value || 1);
    const currencyValue = document.getElementById("currency")?.value || "NOK";

    if (!budgetValue || budgetValue <= 0) {
      alert("Legg inn et gyldig budsjett først.");
      return;
    }

    const code = generateShareCode();

    const { error } = await supabaseClient
      .from("shared_budgets")
      .insert([
        {
          share_code: code,
          budget_amount: budgetValue,
          start_day: startDayValue,
          period_mode: periodModeValue,
          period_length: periodLengthValue,
          currency: currencyValue
        }
      ]);

    if (error) {
      console.error("Kunne ikke opprette delt budsjett:", error);
      alert("Kunne ikke opprette delt budsjett: " + error.message);
      return;
    }

    alert("Delt budsjett opprettet. Kode: " + code);
  }

  const createSharedBtn = document.getElementById("createSharedBtn");
  if (createSharedBtn) {
    createSharedBtn.addEventListener("click", createSharedBudget);
